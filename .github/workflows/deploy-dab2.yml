name: Deploy DAB with Databricks Azure OIDC

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_AUTH_TYPE: azure-oidc
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST2 }}
      DATABRICKS_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_SPB }}
      DATABRICKS_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Request OIDC token from GitHub
        id: oidc
        run: |
          # Request the GitHub OIDC token
          TOKEN=$(curl -H "Accept: application/json" \
                       -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                       "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r '.value')

          echo "OIDC_TOKEN=${TOKEN}" >> $GITHUB_ENV

      - name: Set GHA OIDC token for Databricks CLI
        run: |
          echo "DATABRICKS_AZURE_FEDERATED_TOKEN=${OIDC_TOKEN}" >> $GITHUB_ENV

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy DAB bundle
        run: databricks bundle deploy --target dev
